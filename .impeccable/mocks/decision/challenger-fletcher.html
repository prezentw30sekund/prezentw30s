<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Karla:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;width:390px;height:844px;overflow:hidden;background:#fff;font-family:Karla,sans-serif;color:#111}
.logo{padding:18px 20px;font:800 20px Karla}
h1{margin:10px 20px 0;font:400 54px/0.95 'Gochi Hand';color:#1F3FBF}
.pun{position:relative;margin:30px auto 0;width:300px;height:300px}
.brush{position:absolute;left:130px;top:10px;width:40px;height:220px;background:#1F3FBF;transform:rotate(14deg);border-radius:6px}
.tip{position:absolute;left:118px;top:200px;width:64px;height:80px;background:#E8332A;border-radius:50% 50% 50% 50%/30% 30% 70% 70%;transform:rotate(14deg)}
.gift{position:absolute;left:30px;top:150px;width:110px;height:110px;background:#2E9E4F;transform:rotate(-6deg)}
.gift:after{content:"";position:absolute;left:48px;top:0;bottom:0;width:14px;background:#E8332A}
.cap{position:absolute;bottom:90px;left:20px;right:20px;font:500 18px Karla}
.links{position:absolute;bottom:24px;left:20px;display:flex;gap:10px}
.links a{border:3px solid #111;padding:10px 14px;font:800 18px Karla;color:#111;text-decoration:none;transform:rotate(-2deg)}
</style></head><body><div class="logo">prezentw30s.pl</div>
<h1>Dla malarza do 200 zł</h1>
<div class="pun"><div class="gift"></div><div class="brush"></div><div class="tip"></div></div>
<div class="cap">12 pomysłów, każdy z „Pasuje / Odpuść, jeśli”.</div>
<div class="links"><a href="#">Wędkarz</a><a href="#">Gracz</a><a href="#">Kucharz</a></div>
</body></html>
