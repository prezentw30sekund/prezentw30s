<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
body{margin:0;width:390px;height:844px;overflow:hidden;background:#F4F1EA;font-family:Rubik,sans-serif;color:#111}
.awn{height:86px;background:repeating-linear-gradient(90deg,#127A4B 0 40px,#F4F1EA 40px 80px);position:relative}
.awn:after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:18px;background:radial-gradient(circle at 20px 0,#127A4B 19px,transparent 20px) 0 0/80px 18px repeat-x}
.logo{position:absolute;top:24px;left:20px;background:#111;color:#fff;font:800 22px Rubik;padding:6px 12px}
.price{position:absolute;right:18px;top:110px;width:150px;height:150px;background:#F4FF3A;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg);font-family:'Permanent Marker'}
.price b{font-size:22px;font-weight:400}.price span{font-size:46px;line-height:1}
h1{margin:40px 20px 0;font:800 50px/0.95 Rubik;width:200px}
.crates{position:absolute;left:16px;right:16px;top:330px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.c{height:150px;background:#C68A4E;border:4px solid #8A5A2B;position:relative}
.c .t{position:absolute;left:-6px;top:-14px;background:#fff;border:2px solid #111;font:400 20px 'Permanent Marker';padding:2px 10px;transform:rotate(-4deg)}
.c .p{position:absolute;right:-6px;bottom:-10px;background:#FF5FA2;font:400 22px 'Permanent Marker';padding:2px 10px;transform:rotate(5deg)}
.q{position:absolute;left:16px;right:16px;bottom:24px;background:#111;color:#fff;font:800 20px Rubik;padding:18px;text-align:center}
</style></head><body>
<div class="awn"><div class="logo">prezentw30s.pl</div></div>
<div class="price"><b>do</b><span>200 zł</span></div>
<h1>Dla malarza</h1>
<div class="crates"><div class="c"><div class="t">farby</div><div class="p">89 zł</div></div><div class="c"><div class="t">sztalugi</div><div class="p">179 zł</div></div><div class="c"><div class="t">warsztaty</div><div class="p">150 zł</div></div><div class="c"><div class="t">szkicowniki</div><div class="p">45 zł</div></div></div>
<div class="q">Szybki wybór: osoba · hobby · budżet</div>
</body></html>
