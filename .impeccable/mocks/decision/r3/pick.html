<!doctype html><html lang="pl"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Hanken+Grotesk:wght@400;600;800&display=swap" rel="stylesheet"><style>
body{margin:0;width:390px;height:844px;overflow:hidden;font-family:'Hanken Grotesk',sans-serif;color:#1a1a1a;
background:#0c7a5a;background-image:radial-gradient(circle at 14px 14px,#f2c230 5px,transparent 6px),radial-gradient(circle at 42px 42px,#e9433a 5px,transparent 6px);background-size:56px 56px}
.top{background:#1a1a1a;color:#fff;display:flex;justify-content:space-between;padding:14px 20px;font-weight:800}
.ribbon{position:absolute;left:0;right:0;top:300px;height:34px;background:#e9433a}
.vr{position:absolute;top:0;bottom:0;left:300px;width:34px;background:#e9433a}
.kraft{position:relative;margin:28px 20px 0;background:#c79a62;padding:26px 22px;border-radius:2px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
h1{font:400 50px/0.95 'Bagel Fat One';margin:0;color:#1a1a1a}
.lead{font-weight:600;margin-top:12px}
.tag{position:relative;margin:24px 40px 0 20px;background:#fff;padding:18px 18px 20px 30px;clip-path:polygon(18px 0,100% 0,100% 100%,18px 100%,0 50%);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.tag h2{font:400 26px 'Bagel Fat One';margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:2px solid #1a1a1a;border-radius:99px;padding:8px 12px;font-weight:600}
.bow{position:absolute;right:26px;top:270px;width:92px;height:64px;background:radial-gradient(ellipse at 25% 50%,#e9433a 60%,transparent 62%),radial-gradient(ellipse at 75% 50%,#e9433a 60%,transparent 62%);z-index:3}
</style></head><body>
<div class="top"><span>prezentw30s.pl</span><span>Menu</span></div>
<div class="kraft"><h1>Prezent w 30 sekund</h1><p class="lead">Trzy pytania. Kilka trafionych propozycji. Każda z „Pasuje, jeśli” i „Odpuść, jeśli”.</p></div>
<div class="bow"></div>
<div class="tag"><h2>Dla kogo?</h2><div class="chips"><span>Mama</span><span>Tata</span><span>Partnerka</span><span>Znajomy z pracy</span><span>Dziecko</span><span>Inna osoba</span></div></div>
</body></html>
