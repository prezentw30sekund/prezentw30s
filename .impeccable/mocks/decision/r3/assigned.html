<!doctype html><html lang="pl"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet"><style>
body{margin:0;width:390px;height:844px;overflow:hidden;background:#1d3fa6;font-family:'Bricolage Grotesque',sans-serif;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.logo{font:800 18px 'Bricolage Grotesque'}.logo small{display:block;font-weight:400;font-size:12px;opacity:.8}
.menu{border:2px solid #fff;border-radius:99px;padding:8px 14px;font-weight:600}
.card{margin:10px 18px 0;background:#e8322b;border-radius:6px;padding:24px 22px 26px;box-shadow:0 18px 30px rgba(0,0,0,.35);position:relative;transform:rotate(-1.5deg)}
.card:before{content:"";position:absolute;inset:10px;border:1.5px dashed rgba(255,255,255,.45);border-radius:3px}
h1{font:400 50px/1 Shrikhand;margin:0;color:#ffd23f;text-shadow:0 2px 0 #9e1c17}
.seal{position:absolute;right:16px;top:-26px;width:74px;height:74px;border-radius:50%;background:conic-gradient(#ffd23f 0 40%,#f6e7a8 40%);display:grid;place-items:center;color:#7a1410;font:400 22px Shrikhand;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.inside{margin:-6px 26px 0;background:#fff;color:#1b1b1b;border-radius:0 0 6px 6px;padding:22px 20px 20px;position:relative;z-index:-0}
.inside p{margin:0 0 10px;font-weight:600}
.q{font:400 26px Shrikhand;color:#1d3fa6;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:4px;font-weight:600;font-size:15px;color:#fff}
.rack{margin:22px 0 0;padding:0 18px;display:flex;gap:10px;align-items:flex-end}
.slot{flex:1;height:92px;border-radius:4px 4px 0 0;position:relative}
.slot b{position:absolute;left:8px;top:8px;font:400 18px Shrikhand}
.rail{height:10px;margin:0 10px;background:#0f2766;border-radius:3px}
.browse{margin:16px 20px;font-weight:800;font-size:22px;text-decoration:underline;text-underline-offset:5px}
</style></head><body>
<div class="top"><div class="logo">prezentw30s.pl<small>Prezent w 30 sekund</small></div><div class="menu">Menu</div></div>
<div class="card"><div class="seal">30 s</div><h1>Prezent w&nbsp;30 sekund</h1></div>
<div class="inside"><p class="q">Na jaką okazję?</p><div class="chips">
<span class="chip" style="background:#e8322b">Urodziny</span><span class="chip" style="background:#0f8a5f">Imieniny</span><span class="chip" style="background:#d9468f">Rocznica</span><span class="chip" style="background:#1d3fa6">Święta</span><span class="chip" style="background:#f08a24">Ślub</span><span class="chip" style="background:#6b4bb8">Parapetówka</span><span class="chip" style="background:#333">Inna okazja</span></div></div>
<div class="rack"><div class="slot" style="background:#0f8a5f"><b>Dla mamy</b></div><div class="slot" style="background:#ffd23f;color:#1b1b1b"><b>Do 100 zł</b></div><div class="slot" style="background:#d9468f"><b>Malarz</b></div></div>
<div class="rail"></div>
<div class="browse">Wolę przeglądać stojak</div>
</body></html>
