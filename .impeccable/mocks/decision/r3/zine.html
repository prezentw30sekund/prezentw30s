<!doctype html><html lang="pl"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet"><style>
body{margin:0;width:390px;height:844px;overflow:hidden;background:#f9f9f7;font-family:'Atkinson Hyperlegible',sans-serif;color:#151515}
.top{padding:16px 20px;font:400 20px 'Permanent Marker'}
h1{font:400 52px/1 'Permanent Marker';margin:6px 20px 0}
h1 span{background:linear-gradient(transparent 55%,#ffe14d 55%)}
.napkin{margin:24px 20px 0;border:3px solid #151515;border-radius:14px 22px 12px 26px;padding:18px;position:relative}
.napkin h2{font:400 28px 'Permanent Marker';margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chips span{border:2.5px solid #151515;border-radius:30px 20px 26px 18px;padding:8px 12px;font-weight:700}
.chips span.on{background:#ff6fa8}
.arrow{position:absolute;right:-6px;bottom:-60px;width:110px;height:70px;border-right:3px solid #151515;border-bottom:3px solid #151515;border-radius:0 0 60px 0}
.mascot{margin:72px 0 0 26px;width:84px;height:84px;border:3px solid #151515;border-radius:50%;background:#33c2b0;position:relative}
.mascot:before,.mascot:after{content:"";position:absolute;top:28px;width:12px;height:12px;border-radius:50%;background:#151515}.mascot:before{left:22px}.mascot:after{right:22px}
.say{position:absolute;left:130px;top:610px;width:220px;font:400 22px 'Permanent Marker'}
</style></head><body>
<div class="top">prezentw30s.pl</div>
<h1>Prezent w <span>30 sekund</span></h1>
<div class="napkin"><h2>Na jaką okazję?</h2><div class="chips"><span class="on">Urodziny</span><span>Imieniny</span><span>Rocznica</span><span>Święta</span><span>Ślub</span><span>Inna</span></div><div class="arrow"></div></div>
<div class="mascot"></div><div class="say">Powiem Ci też, kiedy odpuścić.</div>
</body></html>
