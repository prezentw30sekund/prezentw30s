<!doctype html><html lang="pl"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet"><style>
body{margin:0;width:390px;height:844px;overflow:hidden;background:#b98c58;font-family:'Instrument Sans',sans-serif;color:#2a2018}
.top{padding:16px 20px;font:400 18px 'Alfa Slab One';color:#fff}
h1{font:400 44px/1 'Alfa Slab One';margin:10px 20px 0;color:#fff;text-shadow:3px 4px 0 rgba(0,0,0,.25)}
.stage{position:relative;height:300px;margin-top:20px}
.fig{position:absolute;bottom:40px;background:#fff;box-shadow:10px 12px 0 rgba(40,25,10,.35)}
.f1{left:30px;width:80px;height:120px;clip-path:polygon(50% 0,100% 40%,80% 100%,20% 100%,0 40%)}
.f2{left:150px;width:100px;height:170px;background:#c8102e;clip-path:polygon(50% 0,100% 30%,90% 100%,10% 100%,0 30%)}
.f3{left:285px;width:70px;height:110px;clip-path:polygon(50% 0,100% 50%,70% 100%,30% 100%,0 50%)}
.crank{position:absolute;left:0;right:0;bottom:28px;height:8px;background:#2a2018}
.strip{margin:0 20px;background:#f4f4f2;padding:16px 18px;box-shadow:6px 8px 0 rgba(40,25,10,.3)}
.strip h2{font:400 24px 'Alfa Slab One';margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:#fff;border:2px solid #2a2018;padding:8px 12px;font-weight:600}
.chips span.on{background:#c8102e;color:#fff;border-color:#c8102e}
</style></head><body>
<div class="top">prezentw30s.pl</div>
<h1>Prezent w 30 sekund</h1>
<div class="stage"><div class="fig f1"></div><div class="fig f2"></div><div class="fig f3"></div><div class="crank"></div></div>
<div class="strip"><h2>Dla kogo?</h2><div class="chips"><span>Mama</span><span class="on">Tata</span><span>Partnerka</span><span>Znajomy z pracy</span><span>Dziecko</span></div></div>
</body></html>
